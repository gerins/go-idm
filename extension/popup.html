<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GoIDM</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 320px; padding: 14px; }
      header { margin-bottom: 12px; }
      header img { width: 24px; height: 24px; border-radius: 6px; }
      .card { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 10px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: var(--ok); }
      .dot.warn { background: var(--warn); }
      .dot.bad { background: var(--bad); }
      #detail { margin: 6px 0 0 19px; color: var(--muted); font-size: 12px; }
      code { font-size: 11px; user-select: all; }
      #media[hidden] { display: none; }
      #media h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
      #mediaList { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow-y: auto; }
      #mediaList li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
      #mediaList li:first-child { border-top: 0; }
      #mediaList .info { flex: 1; min-width: 0; }
      #mediaList .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #mediaList .meta { color: var(--muted); font-size: 12px; }
      #mediaList button { height: 28px; padding: 0 10px; flex: none; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      .actions button { flex: 1; }
    </style>
  </head>
  <body>
    <header class="row">
      <img src="icons/icon48.png" alt="" />
      <h1>GoIDM</h1>
    </header>

    <div class="card">
      <div class="row">
        <span id="dot" class="dot"></span>
        <strong id="status" class="grow">Checking…</strong>
      </div>
      <div id="detail"></div>
    </div>

    <div id="media" class="card" hidden>
      <h2>Videos on this page</h2>
      <ul id="mediaList"></ul>
    </div>

    <div class="card row">
      <div class="grow">
        <strong>Capture downloads</strong>
        <div class="hint" style="margin-top: 0">Send browser downloads to GoIDM</div>
      </div>
      <label class="switch" title="Capture downloads">
        <input id="enabled" type="checkbox" aria-label="Capture downloads" />
        <i></i>
      </label>
    </div>

    <div class="actions">
      <button id="open" class="primary">Open GoIDM</button>
      <button id="options">Options</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
