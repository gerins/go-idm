<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GoIDM</title>
    <script>
      // Set the theme before first paint to avoid a flash. Keep in sync with src/lib/theme.svelte.ts.
      try {
        var pref = localStorage.getItem('goidm.theme')
        var dark = pref === 'dark' || ((pref === 'system' || !pref) && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
